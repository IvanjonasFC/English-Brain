# Stack GPU del portátil RTX 2060: Ollama (LLM) + Speaches (STT faster-whisper).
# Requiere: drivers NVIDIA + Docker + NVIDIA Container Toolkit.
# El NAS accede a:  http://<IP_PORTATIL>:11434 (Ollama)  y  http://<IP_PORTATIL>:8001/v1 (Speaches)
services:
  ollama:
    image: ollama/ollama:latest
    container_name: eng-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  speaches:
    # OpenAI-compatible faster-whisper server. Puerto interno 8000 -> host 8001.
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    container_name: eng-speaches
    ports:
      - "8001:8000"
    environment:
      - WHISPER__MODEL=Systran/faster-whisper-base
      - WHISPER__COMPUTE_TYPE=float16
    volumes:
      - speaches_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama_models:
  speaches_cache:
