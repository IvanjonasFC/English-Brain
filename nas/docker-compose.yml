  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - backend
  #   restart: unless-stopped

volumes:
  ollama_data:
  models_cache:
  backend_data:
  audio_cache:
